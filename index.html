<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1f3a40" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Scatterly</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    html,body{margin:0;height:100%;background:#1f3a40;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
    #game{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px)}
    #game canvas{display:block}
    #splash{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#1f3a40;color:#f6e7cf;font:600 28px system-ui,"Segoe UI",Roboto,sans-serif;letter-spacing:.04em;pointer-events:none}
    #splash i{display:block;width:140px;height:6px;border-radius:3px;background:#4a3d52;overflow:hidden;position:relative}
    #splash i::after{content:"";position:absolute;top:0;left:-45%;width:45%;height:100%;border-radius:3px;background:#e0955a;animation:slide 1s ease-in-out infinite}
    @keyframes slide{to{left:100%}}
    #turn{display:none;position:fixed;inset:0;z-index:20;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#1f3a40;color:#f6e7cf;font:600 24px system-ui,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
    #turn svg{width:96px;height:96px;animation:turn 2.4s ease-in-out infinite}
    @keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
    @media (orientation:portrait){#turn{display:flex}}
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="turn"><svg viewBox="0 0 24 24" fill="none" stroke="#e0955a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18.5h2"/></svg><span>Turn your phone sideways</span></div>
  <div id="splash"><span>Scatterly</span><i></i></div>
  <script>document.addEventListener('contextmenu',function(e){e.preventDefault()});</script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
