name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: E2E flow (modes, pause, settings, error policy, background)
        run: npx playwright test game.e2e.ts
      - name: E2E leaks and perf (50x restart, 4x CPU throttle)
        if: always()
        run: npx playwright test perf.e2e.ts
      - name: Perf regression gate (software GL, regression only)
        run: node scripts/perf-compare.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: test-results
