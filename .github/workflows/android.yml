name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'tests/**', 'tools/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Patch Android project (landscape, fullscreen, app name, version)
        continue-on-error: true
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = 'android/app/src/main';
          function edit(file, fn) {
            try {
              if (!fs.existsSync(file)) { console.log('skip (missing): ' + file); return; }
              const before = fs.readFileSync(file, 'utf8');
              const after = fn(before);
              if (after !== before) { fs.writeFileSync(file, after); console.log('patched: ' + file); }
              else console.log('unchanged: ' + file);
            } catch (e) { console.log('patch failed (ignored): ' + file + ' ' + e.message); }
          }
          edit(base + '/AndroidManifest.xml', (xml) =>
            xml.replace(/<activity\b[^>]*MainActivity[^>]*>/, (tag) =>
              /android:screenOrientation=/.test(tag)
                ? tag.replace(/android:screenOrientation="[^"]*"/, 'android:screenOrientation="sensorLandscape"')
                : tag.replace('<activity', '<activity android:screenOrientation="sensorLandscape"')));
          edit(base + '/res/values/styles.xml', (xml) =>
            xml.replace(/(<style\s+name="AppTheme\.NoActionBar"[^>]*>)([\s\S]*?)(<\/style>)/, (m, open, body, close) =>
              body.includes('windowFullscreen') ? m
                : open + body +
                  '    <item name="android:windowFullscreen">true</item>\n' +
                  '    <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n' +
                  '    ' + close));
          // versionName from package.json, versionCode from the run number (installs over the previous APK without uninstalling)
          const ver = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          edit('android/app/build.gradle', (g) =>
            g.replace(/versionCode\s+\d+/, 'versionCode ' + process.env.RUN_NUMBER)
             .replace(/versionName\s+"[^"]*"/, 'versionName "' + ver + '"'));
          edit(base + '/res/values/strings.xml', (xml) =>
            xml.replace(/(<string name="app_name">)[^<]*(<\/string>)/, '$1Scatterly$2')
               .replace(/(<string name="title_activity_main">)[^<]*(<\/string>)/, '$1Scatterly$2'));
          NODE

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK (version from package.json + run number)
        id: apk
        run: |
          V=$(node -p "require('./package.json').version")
          NAME="Scatterly-${V}-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Scatterly-debug-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Move the rolling "latest" tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin refs/tags/latest

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Scatterly latest APK
          body: "Debug APK from commit ${{ github.sha }} (build ${{ github.run_number }}). Download the .apk below and install it on your phone; it installs over the previous build."
          prerelease: true
          files: ${{ steps.apk.outputs.name }}
          overwrite_files: true

      - name: Remove older APKs from the latest release (after the new one is up, so the release is never empty)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in $(gh release view latest --json assets -q '.assets[].name'); do
            if [ "$a" != "${{ steps.apk.outputs.name }}" ]; then gh release delete-asset latest "$a" -y; fi
          done
